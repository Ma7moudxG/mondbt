[build]
  command = "npm run build"
  publish = ".next"

[functions] # Consolidate all function settings here
  directory = "netlify/functions"
  node_bundler = "esbuild"
  
  external_node_modules = ["@netlify/functions", "formidable", "@supabase/supabase-js"] 
  included_files = ["./src/lib/supabase/supabaseClient.ts"]


[[plugins]]
  package = "@netlify/plugin-nextjs"